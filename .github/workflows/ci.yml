name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push makes the run in progress irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches docker-compose.yml, so the same commands work locally and here.
  DATABASE_URL: postgresql://nara:nara@localhost:5432/nara
  TEST_DATABASE_URL: postgresql://nara:nara@localhost:5432/nara_test

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nara
          POSTGRES_PASSWORD: nara
          POSTGRES_DB: nara
        ports: ['5432:5432']
        # Without this the steps start before Postgres accepts connections.
        options: >-
          --health-cmd "pg_isready -U nara -d nara"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Format
        run: python -m ruff format --check .

      - name: Migrate
        run: python -m alembic upgrade head

      - name: Check the models match the migrations
        # Catches a model edit that was never given a migration — the failure you would
        # otherwise only find on deploy.
        run: python -m alembic check

      - name: Migrations reverse cleanly
        # The test suite runs `downgrade base` on every session, and a downgrade nobody has
        # tried is a downgrade that does not work.
        run: |
          python -m alembic downgrade base
          python -m alembic upgrade head

      - name: Tests
        run: python -m pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck and build
        # `build` is `tsc -b && vite build`, so this is the typecheck too.
        run: npm run build

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    # Needs the API and the dev server up, so it is slower and kept out of the fast feedback.
    needs: [backend, frontend]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nara
          POSTGRES_PASSWORD: nara
          POSTGRES_DB: nara
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nara -d nara"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: |
          pip install -r backend/requirements.txt
          npm --prefix frontend ci

      - name: Start the API
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m uvicorn app.main:app --port 8000 &
          timeout 60 sh -c 'until curl -sf http://localhost:8000/health/ready; do sleep 1; done'

      - name: Start the dev server
        working-directory: frontend
        run: |
          npm run dev &
          timeout 60 sh -c 'until curl -sf http://localhost:5173/; do sleep 1; done'

      - name: Install Chrome
        # The suite drives real Chrome (`channel: 'chrome'`) rather than a bundled build.
        working-directory: frontend
        run: npx playwright install --with-deps chrome

      - name: Run
        working-directory: frontend
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
