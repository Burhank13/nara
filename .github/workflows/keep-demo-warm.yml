name: Keep the demo warm

# Render's free plan sleeps a service after 15 minutes idle and takes about a minute to wake.
# For a demo people are sent a link to, that minute is the whole impression. Render allows 750
# instance-hours a month and a month is about 730, so one service can simply stay up.
#
# /health is the endpoint to hit, not /health/ready: it has no dependencies, so this keeps the
# web service awake without waking Neon and spending its free compute-hours. The database wakes
# on the first real visitor instead.
#
# Set the repository variable DEMO_URL (Settings → Secrets and variables → Actions → Variables)
# to the Render URL. Without it this does nothing rather than failing loudly every 10 minutes.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

# A queued ping is worthless once a newer one is due.
concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the demo
        env:
          DEMO_URL: ${{ vars.DEMO_URL }}
        run: |
          if [ -z "$DEMO_URL" ]; then
            echo "DEMO_URL is not set — nothing to ping. Set it as a repository variable."
            exit 0
          fi
          # Generous timeout: if it had gone to sleep, this request is the one that wakes it.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "$DEMO_URL/health" || echo 000)
          echo "$DEMO_URL/health -> $code"
          # Don't fail the workflow on a blip; a red cron every so often trains you to ignore it.
          [ "$code" = "200" ] || echo "::warning::demo did not answer 200"
